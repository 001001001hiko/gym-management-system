<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gym Login
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="login-page">


<div class="login-box">


    <h1>
        GYM
    </h1>


    <h2>
        Admin Login
    </h2>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="login-error">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}



    <form
        method="POST"
        action="/login"
        class="login-form"
    >


        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <button type="submit">

            Login

        </button>


    </form>


</div>


</body>

</html>
