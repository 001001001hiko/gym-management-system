<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Change Password
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="login-page">


<div class="login-box">


    <h1>
        GYM
    </h1>


    <h2>
        Change Password
    </h2>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="login-error">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}



    <form
        method="POST"
        class="login-form"
    >


        <input
            type="password"
            name="old_password"
            placeholder="Current Password"
            required
        >


        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            required
        >


        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            required
        >


        <button type="submit">

            Change Password

        </button>


    </form>


    <a
        href="/"
        class="back-link"
    >

        Back to Dashboard

    </a>


</div>


</body>

</html>
